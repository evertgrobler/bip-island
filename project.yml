# XcodeGen project definition. CI runs `xcodegen generate` to make BipIsland.xcodeproj.
# Never commit the .xcodeproj; edit this file instead.
name: BipIsland
options:
  bundleIdPrefix: app.bipisland
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # 0.MINOR.PATCH. Bump MINOR when a build phase finishes.
    MARKETING_VERSION: "0.1.0"
    # CI overrides this with the GitHub Actions run number so every build is newer than the last.
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing (no paid Apple Developer account yet). CI can override for Developer ID later.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    # Filled in by CI for release builds; empty means the updater stays switched off.
    SPARKLE_FEED_URL: ""
    SPARKLE_PUBLIC_KEY: ""

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  BipCore:
    path: BipCore

targets:
  BipIsland:
    type: application
    platform: macOS
    sources:
      - path: BipIsland
      - path: Resources/Audio
        type: folder
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - package: BipCore
    settings:
      base:
        PRODUCT_NAME: Bip Island
        PRODUCT_MODULE_NAME: BipIsland
        PRODUCT_BUNDLE_IDENTIFIER: app.bipisland.game
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: BipIsland/Info.plist
      properties:
        CFBundleDisplayName: Bip Island
        CFBundleName: $(PRODUCT_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: APPL
        CFBundleDevelopmentRegion: en
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.kids-games
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Made for our family.
        # Sparkle 2 auto-updates. Checks hourly, downloads quietly, installs when the app is quit.
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 3600

  BipIslandTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BipCore/Tests/BipCoreTests
    dependencies:
      - package: BipCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bipisland.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BipIsland:
    build:
      targets:
        BipIsland: all
        BipIslandTests: [test]
    test:
      config: Debug
      targets:
        - BipIslandTests
    archive:
      config: Release
