# Builds and tests every pull request. Every push to main also signs the update and
# publishes it to Vercel, where the installed app picks it up via Sparkle.
name: Build

# Only when the Swift app, or something it ships, changes: Mac machines use GitHub minutes fast.
on:
  pull_request:
    paths:
      - "BipIsland/**"
      - "BipCore/**"
      - "Resources/**"
      - "Content/**"
      - "audio/**"
      - "site/**"
      - "project.yml"
      - "scripts/ci/**"
      - "scripts/validate_content.py"
      - "scripts/make_placeholder_audio.py"
      - ".github/workflows/build.yml"
  push:
    branches: [main]
    paths:
      - "BipIsland/**"
      - "BipCore/**"
      - "Resources/**"
      - "Content/**"
      - "audio/**"
      - "site/**"
      - "project.yml"
      - "scripts/ci/**"
      - "scripts/validate_content.py"
      - "scripts/make_placeholder_audio.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # bash with -e and -o pipefail, so a failure inside a pipe fails the step.
    shell: bash

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, test and publish
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DERIVED: build/DerivedData
      PACKAGES: build/SourcePackages
      APP_PATH: build/DerivedData/Build/Products/Release/Bip Island.app
      OUT_DIR: build/updates
      IS_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up tools
        run: |
          xcodebuild -version
          sw_vers
          brew install xcodegen
          xcodegen --version
          openssl_bin="$(brew --prefix openssl@3 2>/dev/null)/bin/openssl"
          if ! "$openssl_bin" version 2>/dev/null | grep -q '^OpenSSL 3'; then
            brew install openssl@3
            openssl_bin="$(brew --prefix openssl@3)/bin/openssl"
          fi
          "$openssl_bin" version
          echo "OPENSSL=$openssl_bin" >> "$GITHUB_ENV"

      - name: Check game content
        run: python3 scripts/validate_content.py

      - name: Make placeholder voice clips
        run: python3 scripts/make_placeholder_audio.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Fetch Swift packages
        run: |
          xcodebuild -resolvePackageDependencies -project BipIsland.xcodeproj -scheme BipIsland \
            -clonedSourcePackagesDirPath "$PACKAGES"

      - name: Run unit tests
        run: |
          mkdir -p build
          xcodebuild test -project BipIsland.xcodeproj -scheme BipIsland -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$DERIVED" -clonedSourcePackagesDirPath "$PACKAGES" 2>&1 \
            | tee build/test.log | grep -E "^Test Case .*(passed|failed)|error:|Executed [0-9]+ test" || true
          # Make sure tests really ran (and none failed), not just that the build succeeded.
          summary="$(grep -E "Executed [0-9]+ tests?, with [0-9]+ failures?" build/test.log | tail -1)"
          echo "$summary"
          echo "**Unit tests:** ${summary:-no summary found}" >> "$GITHUB_STEP_SUMMARY"
          echo "$summary" | grep -Eq "Executed [1-9][0-9]* tests?, with 0 failures" || {
            echo "::error::Unit tests didn't run or didn't all pass."
            exit 1
          }

      - name: Decide whether to publish
        id: release
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          UPDATE_FEED_URL: ${{ vars.UPDATE_FEED_URL }}
        run: |
          key_file="$RUNNER_TEMP/sparkle_key"
          umask 077
          missing=""
          [ -n "$SPARKLE_PRIVATE_KEY" ] || missing="$missing SPARKLE_PRIVATE_KEY"
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"

          publish=false
          if [ "$IS_MAIN" = "true" ] && [ -z "$missing" ]; then
            publish=true
            printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file"
            feed_url="$(scripts/ci/resolve_feed_url.sh)"
          else
            # Not publishing: sign with a throwaway key so the whole update pipeline is still tested.
            scripts/ci/new_sparkle_key.sh > "$key_file"
            feed_url="https://updates.invalid/appcast.xml"
            if [ "$IS_MAIN" = "true" ]; then
              echo "::warning title=Built but not published::These secrets aren't set yet:$missing. The app was built and tested, but no update was published. See docs/SETUP.md."
              echo "### ⚠️ Built but not published" >> "$GITHUB_STEP_SUMMARY"
              echo "Missing secrets:$missing. Follow docs/SETUP.md, then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          public_key="$(scripts/ci/sparkle_public_key.sh < "$key_file")"
          echo "Publishing: $publish"
          echo "Feed URL: $feed_url"
          {
            echo "publish=$publish"
            echo "feed_url=$feed_url"
            echo "public_key=$public_key"
            echo "key_file=$key_file"
          } >> "$GITHUB_OUTPUT"

      - name: Build the app
        run: |
          xcodebuild build -project BipIsland.xcodeproj -scheme BipIsland -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED" -clonedSourcePackagesDirPath "$PACKAGES" -quiet \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            SPARKLE_FEED_URL="${{ steps.release.outputs.feed_url }}" \
            SPARKLE_PUBLIC_KEY="${{ steps.release.outputs.public_key }}"
          ls -la "$APP_PATH/Contents"
          # The app icon (Resources/Assets.xcassets) must make it into the app.
          if [ ! -f "$APP_PATH/Contents/Resources/AppIcon.icns" ]; then
            echo "::error::The app icon (AppIcon.icns) is missing from the built app."
            exit 1
          fi
          # The game font (Resources/Fonts) must be bundled and registered.
          for font in AtkinsonHyperlegible-Regular.ttf AtkinsonHyperlegible-Bold.ttf; do
            if [ ! -f "$APP_PATH/Contents/Resources/Fonts/$font" ]; then
              echo "::error::The font $font is missing from the built app."
              exit 1
            fi
          done
          /usr/libexec/PlistBuddy -c "Print :ATSApplicationFontsPath" "$APP_PATH/Contents/Info.plist" | grep -qx Fonts || {
            echo "::error::Info.plist doesn't register the bundled fonts (ATSApplicationFontsPath)."
            exit 1
          }

      # Opens the built game in screenshot mode for the download page. Never blocks a release:
      # without screenshots the page shows empty frames.
      - name: Take screenshots for the download page
        continue-on-error: true
        timeout-minutes: 6
        run: scripts/ci/take_screenshots.sh

      - name: Keep the screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: build/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Find Sparkle's tools
        run: |
          tool="$(find "$PACKAGES/artifacts" -type f -name generate_appcast 2>/dev/null | head -1)"
          if [ -z "$tool" ]; then
            echo "Not in the package artifacts; downloading Sparkle's release tools."
            curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz
            mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
            tool="$RUNNER_TEMP/sparkle/bin/generate_appcast"
          fi
          echo "SPARKLE_BIN=$(dirname "$tool")" >> "$GITHUB_ENV"
          echo "Sparkle tools: $(dirname "$tool")"

      - name: Sign and package the update
        id: package
        env:
          KEY_FILE: ${{ steps.release.outputs.key_file }}
          FEED_URL: ${{ steps.release.outputs.feed_url }}
        run: scripts/ci/package_update.sh

      - name: Keep the zipped app
        uses: actions/upload-artifact@v4
        with:
          name: BipIsland-${{ steps.package.outputs.version }}-${{ steps.package.outputs.build }}
          path: ${{ env.OUT_DIR }}
          retention-days: 14

      - name: Publish to Vercel
        if: steps.release.outputs.publish == 'true'
        env:
          FEED_URL: ${{ steps.release.outputs.feed_url }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          VERSION: ${{ steps.package.outputs.version }}
          BUILD: ${{ steps.package.outputs.build }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          scripts/ci/deploy_vercel.sh
          site="${FEED_URL%/*}/"
          {
            echo "### ✅ Published version $VERSION (build $BUILD)"
            echo "Download page: $site"
            echo
            echo "Installed copies will update themselves."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/sparkle_key"
