# Builds and tests the Godot version of the game (Mac + Windows). See docs/GODOT_MIGRATION.md.
# Once a day (and on a manual run), main is tested on real Mac and Windows machines, then published from
# this public repository: a GitHub Release (installers and update files) and the download page (site/) on
# GitHub Pages.
name: Godot

# Docs-only changes run nothing. Pull requests run the Linux job only; the Mac and Windows
# install-and-update tests (Mac minutes are expensive) and the publish run on the daily main build
# and on manual runs.
on:
  pull_request:
    paths:
      - "godot/**"
      - "scripts/godot/**"
      - "scripts/check_all.sh"
      - "scripts/validate_content.py"
      - "scripts/sa_english.py"
      - "scripts/af_spelling.py"
      - "scripts/spoken_numbers.py"
      - "scripts/ci/deploy_site.sh"
      - "scripts/ci/site_screenshots.sh"
      - "site/**"
      - "Content/**"
      - "Resources/**"
      - "audio/**"
      - ".github/workflows/godot.yml"
  # main publishes once a day, not on every merge (owner decision, 25 October 2026), so the family sees
  # one update a day at most. The daily run skips itself when main hasn't changed since the last
  # published build.
  schedule:
    - cron: "52 18 * * *" # 20:52 SAST
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2
  VPK_VERSION: 1.2.161
  # The Godot test build's Velopack id, so it installs next to anything else.
  PACK_ID: BipIslandTest
  # The public repository the game updates from (this one): one GitHub Release per version, and the
  # download page on GitHub Pages. The publish job writes with the workflow's own token.
  DOWNLOADS_REPO: ${{ github.repository }}
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # The daily build only goes ahead when a file that goes into the game or the download page has
  # changed since the commit the latest release was built from (its description, written by
  # github_release.py finish), so a quiet or docs-only day publishes nothing. The daily run tries each commit once: one that failed (or didn't publish because
  # main moved on) isn't rebuilt nightly; a manual run or the next change tries again. Pull requests
  # and manual runs always go ahead.
  changed:
    name: Anything new on main?
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The whole history for git diff, but no file contents from the past (audio clips are big).
          fetch-depth: 0
          filter: blob:none

      # A commit is tried once: if its build or test fails, it isn't rebuilt every night (a manual
      # run or the next change to main tries again).
      - name: Was this commit tried already?
        id: tried
        uses: actions/cache/restore@v4
        with:
          path: .daily-tried
          key: daily-tried-${{ github.sha }}
          lookup-only: true

      - id: check
        env:
          TRIED: ${{ steps.tried.outputs.cache-hit }}
          DOWNLOADS_TOKEN: ${{ github.token }}
        # Anything that can't be worked out builds anyway ("go=true"); only a clear "nothing new" skips.
        run: |
          if [ "$TRIED" = "true" ]; then
            echo "This commit (${GITHUB_SHA:0:7}) was built on an earlier night; nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(python3 scripts/godot/github_release.py published 2>/dev/null)" || last=""
          if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null; then
            echo "No published commit found (${last:-none}); building."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only changes that go into the game or the download page: the pull_request paths above, read from
          # this file so the two lists can't drift ("dir/**" -> ^dir/, a file -> ^file$).
          # Only "dir/**" and plain file names are understood; anything else (*, ?, [, !) builds to be safe.
          paths="$(yq -r '.on.pull_request.paths[]' .github/workflows/godot.yml)" || paths=""
          if printf '%s\n' "$paths" | sed -e '/^$/d' -e 's#/\*\*$##' | grep -q '[][*?!"]'; then
            echo "::warning::A pull_request path isn't \"dir/**\" or a plain file name; building to be safe."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          game="^($(printf '%s\n' "$paths" | sed -e '/^$/d' -e 's/\./\\./g' -e 's#/\*\*$#/#' -e '/\/$/!s/$/$/' | paste -sd'|'))"
          if [ "$game" = "^()" ]; then
            echo "::warning::Couldn't read the pull_request paths; building to be safe."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$last" HEAD)" || files="?"
          if [ "$files" = "?" ] || printf '%s\n' "$files" | grep -Eq "$game"; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing that goes into the game changed since the published build (${last:0:7}); nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remember this commit was tried
        if: steps.check.outputs.go == 'true'
        run: mkdir -p .daily-tried && echo "$GITHUB_SHA" > .daily-tried/sha

      - name: Save that
        if: steps.check.outputs.go == 'true'
        uses: actions/cache/save@v4
        with:
          path: .daily-tried
          key: daily-tried-${{ github.sha }}

  export:
    name: Test and export (Linux)
    needs: changed
    # changed runs only on the daily schedule; pull requests and manual runs skip it and go ahead.
    if: ${{ !cancelled() && (needs.changed.result == 'skipped' || needs.changed.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up tools
        timeout-minutes: 10
        run: |
          # Only install what the runner image lacks; a slow package mirror once hung this step.
          missing=""
          command -v ffmpeg > /dev/null || missing="$missing ffmpeg"
          command -v xvfb-run > /dev/null || missing="$missing xvfb"
          ldconfig -p | grep -q 'libGL.so.1' || missing="$missing libgl1 libglx-mesa0"
          if [ -n "$missing" ]; then
            echo "Installing:$missing"
            for attempt in 1 2 3; do
              if timeout 180 sudo apt-get update -q -o Acquire::Retries=3 > /dev/null &&
                 timeout 300 sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 $missing > /dev/null; then
                break
              fi
              [ "$attempt" = 3 ] && { echo "::error::Couldn't install:$missing"; exit 1; }
              echo "Package install attempt $attempt failed; trying again."
              sleep 10
            done
          fi
          ffmpeg -version | head -1
          command -v xvfb-run

      - name: Install Velopack
        timeout-minutes: 5
        run: dotnet tool install -g vpk --version "$VPK_VERSION"

      - name: Check game content
        run: python3 scripts/validate_content.py

      - name: Version
        id: version
        run: |
          version="0.2.${GITHUB_RUN_NUMBER}"
          scripts/godot/set_version.sh "$version" "$GITHUB_RUN_NUMBER"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Copy fonts, content and voice clips into the Godot project
        run: python3 scripts/godot/prepare_assets.py

      # Installed copies check the GitHub Releases of the public downloads repository (Updater.cs).
      - name: Update source (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          printf '{"github": "https://github.com/%s"}\n' "$DOWNLOADS_REPO" > godot/assets/update.json
          echo "Updates from: https://github.com/$DOWNLOADS_REPO/releases"

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono

      - name: Install Godot
        run: echo "GODOT=$(scripts/godot/install_godot.sh)" >> "$GITHUB_ENV"

      - name: Build the C# code and import assets
        working-directory: godot
        run: |
          dotnet build -warnaserror
          "$GODOT" --headless --path . --import

      - name: Test the game logic (BipCore)
        run: dotnet test godot/BipCore.Tests

      - name: Self-test (fonts, content, clips)
        working-directory: godot
        run: |
          mkdir -p ../build/godot
          "$GODOT" --headless --path . -- --bip-report ../build/godot/report-linux.json
          python3 ../scripts/godot/check_report.py ../build/godot/report-linux.json

      - name: Walk-through (clicks and keys round every screen)
        working-directory: godot
        run: |
          "$GODOT" --headless --path . -- --bip-save-dir "$RUNNER_TEMP/walk-saves" --bip-walk ../build/godot/walk.json

      - name: Screenshots
        working-directory: godot
        run: |
          mkdir -p ../build/godot/screenshots
          xvfb-run -a -s "-screen 0 1600x1000x24" "$GODOT" --path . --rendering-driver opengl3 \
            --resolution 1600x1000 -- --bip-windowed --bip-screenshot ../build/godot/screenshots/main.png \
            2>&1 | grep -v ALSA || true
          test -s ../build/godot/screenshots/main.png || {
            echo "::error::The screenshot wasn't made."
            exit 1
          }

      - name: Screenshots for the download page
        continue-on-error: true
        run: scripts/ci/site_screenshots.sh

      - name: Export for Mac and Windows
        working-directory: godot
        run: |
          mkdir -p build/windows build/macos
          "$GODOT" --headless --path . --export-release "Windows" "build/windows/Bip Island.exe" 2>&1 | tee ../build/godot/export-windows.log
          "$GODOT" --headless --path . --export-release "macOS" "build/macos/BipIsland.zip" 2>&1 | tee ../build/godot/export-macos.log
          test -f "build/windows/Bip Island.exe" && test -f "build/windows/Bip Island.pck" || {
            echo "::error::The Windows export is missing files."; exit 1; }
          test -s build/macos/BipIsland.zip || { echo "::error::The Mac export is missing."; exit 1; }
          du -sh build/windows build/macos

      - name: Pack the Windows installer and update (Velopack)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out=build/godot/windows
          for v in "$VERSION-selftest:old" "$VERSION:win"; do
            vpk "[win]" pack -x --packId "$PACK_ID" --packVersion "${v%%:*}" --packDir "godot/build/windows" \
              --mainExe "Bip Island.exe" --packTitle "Bip Island" --skipVeloAppCheck --icon godot/icons/app-icon.ico --outputDir "$out/${v##*:}"
          done
          ls -la "$out"/*

      - name: Keep the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: godot-screenshots-${{ steps.version.outputs.version }}
          path: build/godot/screenshots
          retention-days: 14

      - name: Keep the download page screenshots
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: build/site-screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the Mac export
        uses: actions/upload-artifact@v4
        with:
          name: godot-macos-export
          path: godot/build/macos/BipIsland.zip
          retention-days: 3
          compression-level: 0

      - name: Keep the Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: godot-windows-packages
          path: build/godot/windows
          retention-days: 3
          compression-level: 0

  windows:
    name: Install and update test (Windows)
    needs: export
    # !cancelled() and the result check stand in for success(), which would also look at the skipped
    # "changed" job on manual runs and skip this one too (actions/runner#491).
    if: ${{ !cancelled() && needs.export.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Get the packages
        uses: actions/download-artifact@v4
        with:
          name: godot-windows-packages
          path: packages

      - name: Install the older version, update it, check
        shell: pwsh
        run: >
          scripts/godot/windows_update_test.ps1 -OldDir packages/old -NewDir packages/win
          -Version "${{ needs.export.outputs.version }}" -PackId "$env:PACK_ID"

      # The download page's "install without the warning" line (site/index.html, cmd-win), in Windows
      # PowerShell, against this build's setup file and without its last step (running it): the download
      # must have no "from the internet" mark (Zone.Identifier), which is what SmartScreen warns about.
      - name: Check the download page's Windows install line
        shell: powershell
        run: |
          $page = Get-Content site/index.html -Raw -Encoding UTF8
          $line = [System.Net.WebUtility]::HtmlDecode([regex]::Match($page, '(?s)<pre id="cmd-win">(.*?)</pre>').Groups[1].Value)
          $run = '; Start-Process $f'
          if (-not $line.EndsWith($run)) { throw "The Windows install line should end by running the setup file." }
          $setup = Get-ChildItem packages/win -Filter *Setup.exe | Select-Object -First 1
          if (-not $setup) { throw "No setup file in packages/win." }
          $url = ([System.Uri]$setup.FullName).AbsoluteUri
          Invoke-Expression ($line.Substring(0, $line.Length - $run.Length).Replace('{{WIN_URL}}', $url))
          $f = "$env:TEMP\BipIsland-win-Setup.exe"
          if ((Get-Item $f).Length -ne $setup.Length) { throw "The install line didn't download the whole setup file." }
          if (Get-Item $f -Stream Zone.Identifier -ErrorAction SilentlyContinue) { throw "The download is marked as from the internet: SmartScreen would still warn." }
          Remove-Item $f
          "The download page's Windows install line works."

      - name: Keep the Windows release
        uses: actions/upload-artifact@v4
        with:
          name: godot-windows-${{ needs.export.outputs.version }}
          path: packages/win
          retention-days: 14
          compression-level: 0

  macos:
    name: Package, install and update test (Mac)
    needs: export
    if: ${{ !cancelled() && needs.export.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Velopack
        run: dotnet tool install -g vpk --version "$VPK_VERSION"

      - name: Get the export
        uses: actions/download-artifact@v4
        with:
          name: godot-macos-export
          path: export

      - name: Pack, install the older version, update it, check, make the .dmg
        env:
          EXPORT_ZIP: export/BipIsland.zip
          VERSION: ${{ needs.export.outputs.version }}
          OUT_DIR: build/godot/macos
        run: scripts/godot/mac_package_and_test.sh

      - name: Keep the Mac release
        uses: actions/upload-artifact@v4
        with:
          name: godot-macos-${{ needs.export.outputs.version }}
          path: build/godot/macos
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish the release (GitHub Releases and Pages)
    needs: [export, windows, macos]
    if: >-
      ${{ !cancelled() && needs.export.result == 'success' && needs.windows.result == 'success'
      && needs.macos.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The workflow's own token makes the release (contents) and deploys the page (pages, id-token).
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.page.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Velopack
        timeout-minutes: 5
        run: dotnet tool install -g vpk --version "$VPK_VERSION"

      - name: Get the Windows release
        uses: actions/download-artifact@v4
        with:
          name: godot-windows-${{ needs.export.outputs.version }}
          path: release/windows

      - name: Get the Mac release
        uses: actions/download-artifact@v4
        with:
          name: godot-macos-${{ needs.export.outputs.version }}
          path: release/macos

      # One GitHub Release per version holds both computers' update files (releases.win.json,
      # releases.osx.json and their packages) and the two downloads. It stays a draft, hidden from
      # installed games, until the Mac files are in; then it's published, marked latest (noting the
      # commit it was built from), and all but the newest 5 releases are deleted.
      - name: Publish the release
        id: release
        env:
          DOWNLOADS_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.export.outputs.version }}
        run: |
          # Never let an older run overwrite a newer one.
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on, so this older build isn't published."
            exit 0
          fi
          release() { python3 scripts/godot/github_release.py "$@"; }
          upload() { # upload <channel> <folder> [more vpk options]
            vpk "[$1]" upload github --channel "$1" --outputDir "$2" \
              --repoUrl "https://github.com/$DOWNLOADS_REPO" --token "$DOWNLOADS_TOKEN" \
              --releaseName "Bip Island $VERSION" --tag "$VERSION" "${@:3}"
          }
          release trim release/windows win
          release trim release/macos/osx osx
          release clear "$VERSION"
          upload win release/windows
          release attach "$VERSION" release/macos/BipIsland-mac.dmg
          upload osx release/macos/osx --merge --publish
          release finish "$VERSION" --keep 5
          # The download page's links: fetch the first byte of each.
          for file in BipIsland-mac.dmg BipIsland-win-Setup.exe; do
            url="https://github.com/$DOWNLOADS_REPO/releases/latest/download/$file"
            for attempt in 1 2 3 4 5 6; do
              curl -fsSL -r 0-0 -o /dev/null "$url" && break
              [ "$attempt" = 6 ] && { echo "::error::The download link $url doesn't work."; exit 1; }
              sleep 10
            done
          done
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Get the download page screenshots
        if: steps.release.outputs.published == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: site-screenshots
          path: build/site-screenshots

      - name: Build the download page
        if: steps.release.outputs.published == 'true'
        env:
          VERSION: ${{ needs.export.outputs.version }}
        run: scripts/ci/deploy_site.sh

      # The page goes on GitHub Pages (Settings → Pages → Source: GitHub Actions, set once by the owner,
      # docs/SETUP.md). The release is already out, so a page that doesn't go up is a warning.
      - name: Set up GitHub Pages
        if: steps.release.outputs.published == 'true'
        continue-on-error: true
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload the download page
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

      - name: Publish the download page (GitHub Pages)
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        id: page
        uses: actions/deploy-pages@v4

      - name: Summary
        if: always() && steps.release.outputs.published == 'true'
        env:
          PAGE: ${{ steps.page.outputs.page_url }}
          PAGE_OUTCOME: ${{ steps.page.outcome }}
        run: |
          if [ "$PAGE_OUTCOME" != "success" ]; then
            echo "::warning::The release is out, but the download page wasn't published. Is GitHub Pages set to \"GitHub Actions\" (docs/SETUP.md)?"
          fi
          {
            echo "### Bip Island ${{ needs.export.outputs.version }} published"
            echo "- Download page: ${PAGE:-not published}"
            echo "- Release: https://github.com/$DOWNLOADS_REPO/releases/tag/${{ needs.export.outputs.version }}"
            echo
            echo "Installed copies download this version quietly; a grown-up approves the install."
          } >> "$GITHUB_STEP_SUMMARY"
