# Records the narrator clips with Gemini's Aoede voice (scripts/gemini_narrator.py), a batch at a time
# within Gemini's free daily limit, and commits them to the same branch. Needs the GEMINI_API_KEY secret.
# Started by a push of voice-lab/aoede-run.txt (a daily nudge; its first line is how many requests
# the run may make) or by hand.
name: Aoede narrator

on:
  workflow_dispatch:
  push:
    # The recorder's own branch only: other claude/ branches carry this file in after merging main.
    branches: ["claude/aoede-narrator"]
    paths:
      - "voice-lab/aoede-run.txt"

permissions:
  contents: write

concurrency:
  group: aoede-${{ github.ref }}
  cancel-in-progress: false

jobs:
  speak:
    # Only ever on claude/ branches, even when started by hand (the Actions tab picks main by default):
    # clips reach main through a reviewed pull request.
    if: startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg and Whisper (CPU)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install faster-whisper
      - name: Record a day's batches
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/validate_content.py > /dev/null
          MAX_REQUESTS=$(head -1 voice-lab/aoede-run.txt | tr -dc 0-9) python3 scripts/gemini_narrator.py
      # Even when recording stopped with an error: the clips already checked are kept.
      - name: Commit the clips
        if: ${{ !cancelled() }}
        run: |
          git config user.name "aoede-narrator"
          git config user.email "aoede-narrator@users.noreply.github.com"
          mkdir -p voice-lab/aoede_phonics
          git add Resources/Audio voice-lab/aoede.json voice-lab/aoede_phonics
          git commit -m "Narrator clips from Gemini Aoede, checked by Whisper [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
