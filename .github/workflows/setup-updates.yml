# Run once, by hand (Actions tab → "Set up the download site" → Run workflow).
# Makes the Vercel project for the download page, then shows the values to save as secrets.
# Only needed again if the Vercel project is lost. See docs/SETUP.md.
name: Set up the download site

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: "Vercel project name (becomes <name>.vercel.app)"
        type: string
        default: bip-island-updates

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            {
              echo "## Vercel"
              echo "⚠️ **Add the \`VERCEL_TOKEN\` secret first** (docs/SETUP.md, step 2), then run this workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          api() {
            method="$1"; path="$2"; body="${3:-}"
            sep="?"; case "$path" in *\?*) sep="&" ;; esac
            url="https://api.vercel.com$path"
            [ -n "$team_id" ] && url="$url${sep}teamId=$team_id"
            if [ -n "$body" ]; then
              curl -sS -X "$method" -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" -d "$body" "$url"
            else
              curl -sS -X "$method" -H "Authorization: Bearer $VERCEL_TOKEN" "$url"
            fi
          }

          team_id=""
          user="$(api GET /v2/user)"
          team_id="$(printf '%s' "$user" | jq -r '.user.defaultTeamId // empty')"
          org_id="${team_id:-$(printf '%s' "$user" | jq -r '.user.id // empty')}"
          if [ -z "$org_id" ]; then
            echo "::error::Vercel didn't accept the token. Make a new token and update the VERCEL_TOKEN secret."
            printf '%s\n' "$user" | jq -r '.error.message // .' >&2
            exit 1
          fi

          project="$(api GET "/v9/projects/$PROJECT_NAME")"
          project_id="$(printf '%s' "$project" | jq -r '.id // empty')"
          if [ -z "$project_id" ]; then
            project="$(api POST /v11/projects "$(jq -nc --arg name "$PROJECT_NAME" '{name: $name, framework: null}')")"
            project_id="$(printf '%s' "$project" | jq -r '.id // empty')"
          fi
          if [ -z "$project_id" ]; then
            echo "::error::Couldn't create the Vercel project: $(printf '%s' "$project" | jq -r '.error.message // .')"
            exit 1
          fi
          # The update feed must be public: switch off Vercel Authentication for this project.
          api PATCH "/v9/projects/$project_id" '{"ssoProtection": null}' > /dev/null

          # Publish a holding page so the project gets its web address.
          mkdir -p "$RUNNER_TEMP/site"
          cp site/placeholder.html "$RUNNER_TEMP/site/index.html"
          VERCEL_ORG_ID="$org_id" VERCEL_PROJECT_ID="$project_id" \
            npx --yes vercel@latest deploy "$RUNNER_TEMP/site" --prod --yes --token "$VERCEL_TOKEN"

          feed_url="$(VERCEL_ORG_ID="$org_id" VERCEL_PROJECT_ID="$project_id" scripts/ci/resolve_feed_url.sh)"
          {
            echo "## Vercel"
            echo "Add two more **repository secrets**:"
            echo
            echo "| Name | Value |"
            echo "| --- | --- |"
            echo "| \`VERCEL_ORG_ID\` | \`$org_id\` |"
            echo "| \`VERCEL_PROJECT_ID\` | \`$project_id\` |"
            echo
            echo "Your download page will be **${feed_url%/appcast.xml}/**."
            echo
            echo "## Next"
            echo "Once both are set: Actions → **Godot** → **Run workflow** (branch \`main\`). When it's green, open the download page above."
          } >> "$GITHUB_STEP_SUMMARY"
